<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="logo-icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#1B2A3D">
<title>GeoAcento — Celebramos nuestras voces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A3D; --paper:#FAF7F2; --brass:#B08D57; --red:#C1443C; --teal:#3F7D6B;
    --border-subtle: rgba(27,42,61,0.12); --shadow: 0 4px 20px rgba(27,42,61,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:'Inter', sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .wrap{ width:100%; max-width:400px; text-align:center; }
  .brand-icon{ width:64px; height:64px; margin:0 auto 16px; display:block; }
  .eyebrow{
    font-family:'Inter', sans-serif; font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--brass); font-weight:700;
  }
  h1{ font-family:'Fraunces', serif; font-size:36px; margin:6px 0 8px; letter-spacing:-0.01em; }
  p.tagline{ font-size:15px; color:#4b5a6b; line-height:1.5; margin:0 0 30px; }
  .links{ display:flex; flex-direction:column; gap:12px; }
  .link-btn{
    display:flex; align-items:center; justify-content:center; gap:10px;
    text-decoration:none; font-weight:600; font-size:16px; padding:16px 20px; border-radius:16px;
    border:1px solid var(--border-subtle); box-shadow:var(--shadow); transition:transform .15s ease;
  }
  .link-btn:hover{ transform:translateY(-2px); }
  .link-btn.primary{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .link-btn.secondary{ background:var(--red); color:#fff; border-color:var(--red); }
  .link-btn.tertiary{ background:#fff; color:var(--ink); }
  .footnote{ margin-top:28px; font-size:12px; color:#8b95a1; line-height:1.6; }
  .footnote a{ color:var(--brass); }
</style>
</head>
<body>
<div class="wrap">
  <svg class="brand-icon" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M100,175 C64,120.75 45,107.0 45,85 A55,55 0 1 1 155,85 C155,107.0 136,120.75 100,175 Z" fill="#1B2A3D"/>
    <rect x="72.5" y="73" width="7" height="24" rx="3.5" fill="#FAF7F2"/>
    <rect x="84.5" y="65" width="7" height="40" rx="3.5" fill="#FAF7F2"/>
    <rect x="96.5" y="56" width="7" height="58" rx="3.5" fill="#FAF7F2"/>
    <rect x="108.5" y="65" width="7" height="40" rx="3.5" fill="#FAF7F2"/>
    <rect x="120.5" y="73" width="7" height="24" rx="3.5" fill="#FAF7F2"/>
  </svg>
  <span class="eyebrow">Celebramos nuestras voces</span>
  <h1>GeoAcento</h1>
  <p class="tagline">Un mapa de acentos que construimos entre todos, una voz a la vez.</p>

  <div class="links">
    <a href="geoacento.html" class="link-btn primary">🎧 Jugar</a>
    <a href="grabar.html" class="link-btn secondary">🎙️ Graba tu acento</a>
    <a href="explorar.html" class="link-btn tertiary">🔍 Explorar el mapa</a>
  </div>

  <p class="footnote">Proyecto abierto y en beta. <a href="privacidad.html">Privacidad</a></p>
</div>
</body>
</html>
